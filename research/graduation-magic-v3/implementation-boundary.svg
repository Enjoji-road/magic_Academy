<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="t d"><title id="t">既存試験と新規余韻モデルの境界</title><desc id="d">既存の採点と物理を保護し、その描画座標だけを参照する余韻の層を新設。新しい研究保存キーだけに状態を保存する。</desc><rect width="1000" height="690" rx="15" fill="#14242c"/><g font-family="sans-serif" fill="#f4ede0"><text x="40" y="48" font-size="14" fill="#e7c884" letter-spacing="2">INTEGRATION BOUNDARY · NEW PROPOSAL</text><text x="40" y="91" font-size="28">初回の試験を変えず、同じ装置を見直す</text>
<rect x="40" y="128" width="430" height="402" rx="10" fill="#1e343b" stroke="#77939a"/><rect x="530" y="128" width="430" height="402" rx="10" fill="#283d40" stroke="#e7c884"/><text x="65" y="169" font-size="21">現在ある物理・採点</text><text x="555" y="169" font-size="21" fill="#e7c884">新規：術の余韻と受け渡し</text>
<g font-size="15"><text x="65" y="224">炎：固定札・二光源・穴の共通部分</text><text x="555" y="224">水へ：灯の余韻を映す</text><text x="65" y="289">水：等温の封印瓶・計量鐘</text><text x="555" y="289">風へ：外水盤の像を巡らせる</text><text x="65" y="354">風：一枚の半ひねり帯・単一境界</text><text x="555" y="354">土へ：同じ境界全体の形を受け取る</text><text x="65" y="419">土：九石・二刻印・隣接条件</text><text x="555" y="419">炎へ：動かす術の輪郭を灯す</text></g>
<g stroke="#47616a"><path d="M62 247H448M62 312H448M62 377H448M62 442H448M552 247H938M552 312H938M552 377H938M552 442H938"/></g><text x="65" y="483" font-size="14" fill="#bbc9c6">正答・保存形式・観測条件を保持</text><text x="555" y="483" font-size="14" fill="#bbc9c6">存在・支え・出所・有限魔力を別保存</text>
<path d="M500 132V526" stroke="#c6d8d7" stroke-dasharray="6 7"/><text x="500" y="563" text-anchor="middle" font-size="16" fill="#e7c884">余韻から物理モデルへ値を戻さない</text><rect x="40" y="592" width="920" height="58" rx="6" fill="#0f2630" stroke="#47616a"/><text x="500" y="628" text-anchor="middle" font-size="14">今回の変更は research/graduation-magic-v3/ のみ。正式ページと既存保存は変更しない。</text></g></svg>
